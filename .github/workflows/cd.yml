name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/forecast-api
  DASHBOARD_IMAGE: ghcr.io/${{ github.repository }}/forecast-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: .

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.dashboard
          push: true
          tags: |
            ${{ env.DASHBOARD_IMAGE }}:latest
            ${{ env.DASHBOARD_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v3

      - uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/api-deployment.yaml
          kubectl apply -f k8s/api-service.yaml
          kubectl apply -f k8s/dashboard-deployment.yaml
          kubectl apply -f k8s/dashboard-service.yaml
          kubectl apply -f k8s/training-job.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Update API image
        run: |
          kubectl set image deployment/forecast-api \
            api=${{ env.API_IMAGE }}:${{ github.sha }} \
            -n demand-forecast

      - name: Update Dashboard image
        run: |
          kubectl set image deployment/forecast-dashboard \
            dashboard=${{ env.DASHBOARD_IMAGE }}:${{ github.sha }} \
            -n demand-forecast

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/forecast-api -n demand-forecast --timeout=300s
          kubectl rollout status deployment/forecast-dashboard -n demand-forecast --timeout=300s
