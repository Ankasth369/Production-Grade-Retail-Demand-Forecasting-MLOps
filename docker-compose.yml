services:
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install --no-cache-dir mlflow &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:///mlflow_data/mlflow.db
      --default-artifact-root /mlflow_data/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow_data:/mlflow_data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - API_KEY=${API_KEY:-dev-local-key-change-in-prod}
      - RATE_LIMIT=${RATE_LIMIT:-60/minute}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - mlflow

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - API_URL=http://api:8000
      - ARTIFACTS_DIR=/app/artifacts
      - PYTHONPATH=/app
      - API_KEY=${API_KEY:-dev-local-key-change-in-prod}
    depends_on:
      - api

  training:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    command: ["python", "-m", "src.models.train"]
    profiles:
      - train
    depends_on:
      - mlflow
